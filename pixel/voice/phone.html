<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phone">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>Phone</title>
<script>
// On a real phone the page is the screen itself (the OS draws the status bar). Anywhere else it draws an iPhone.
(function () {
  var real = window.matchMedia('(max-width: 540px) and (pointer: coarse)').matches || navigator.standalone === true;
  document.documentElement.className = real ? 'real' : 'sim';
})();
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
svg{display:block}

/* ---------- device ---------- */
.sim body{background:#111214;display:grid;place-items:center}
.sim body.embed{background:#0b0d12}
.device{position:relative;width:393px;height:852px;flex:none;transform-origin:center center}
.sim .device{border-radius:62px;padding:12px;width:417px;height:876px;
  background:linear-gradient(145deg,#4a4c50,#1d1e20 30%,#2b2c2f 70%,#55575b);
  box-shadow:0 0 0 1.5px #6b6d72 inset,0 0 0 6px #0a0a0a inset,0 40px 90px rgba(0,0,0,.55)}
.sim .device::before,.sim .device::after{content:"";position:absolute;width:4px;border-radius:2px;background:#3a3b3e}
.sim .device::before{left:-3px;top:180px;height:64px;box-shadow:0 84px 0 #3a3b3e}
.sim .device::after{right:-3px;top:250px;height:100px}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:50px;background:#000;isolation:isolate}
.real .device{width:100vw;height:100vh;height:100dvh}
.real .screen{border-radius:0}

/* status bar + island (simulated device only) */
.statusbar{position:absolute;z-index:20;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:4px 34px 0 52px;font:600 17px/1 -apple-system,"SF Pro Text",sans-serif;letter-spacing:-.2px;pointer-events:none}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.island{position:absolute;z-index:21;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000}
.homebar{position:absolute;z-index:20;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:#fff;pointer-events:none}
.real .statusbar,.real .island,.real .homebar{display:none}
.sb-hide .statusbar .clock-slot{visibility:hidden}

/* safe areas: on a real phone from env(), on the simulated one fixed */
.sim .view{--top:54px;--bottom:34px}
.real .view{--top:max(env(safe-area-inset-top),20px);--bottom:max(env(safe-area-inset-bottom),16px)}

.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:1;transition:opacity .35s ease}
.view[hidden]{display:flex!important;opacity:0;pointer-events:none}

/* ---------- lock screen ---------- */
#v-lock{background:
  radial-gradient(120% 70% at 15% 0%,#3d5a8a 0%,transparent 60%),
  radial-gradient(110% 80% at 100% 35%,#7b4f86 0%,transparent 55%),
  radial-gradient(120% 80% at 30% 100%,#c06c4c 0%,transparent 60%),
  linear-gradient(180deg,#1b2340 0%,#2b2240 50%,#3a2433 100%)}
.ls-head{margin-top:calc(var(--top) + 22px);text-align:center}
.ls-date{font-size:21px;font-weight:600;color:rgba(255,255,255,.88);letter-spacing:.1px}
.ls-time{font-size:104px;line-height:1;font-weight:700;letter-spacing:-2px;margin-top:2px;color:rgba(255,255,255,.92);
  font-family:"SF Pro Rounded",-apple-system,"SF Pro Display",sans-serif}
.ls-foot{margin-top:auto;padding:0 46px calc(var(--bottom) + 30px);display:flex;justify-content:space-between;align-items:center}
.ls-btn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
  background:rgba(40,40,48,.42);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

/* ---------- call backdrop (shared by incoming + in-call) ---------- */
.callbg{background:
  radial-gradient(130% 60% at 50% 0%,#5b6170 0%,transparent 70%),
  linear-gradient(180deg,#3f434c 0%,#2a2d33 45%,#17181b 100%)}
.cid{text-align:center;padding:0 28px}
.cid .sub{font-size:17px;color:rgba(235,235,245,.62);letter-spacing:-.2px}
.cid .name{font-size:34px;font-weight:500;letter-spacing:-.4px;line-height:1.15;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- incoming ---------- */
#v-ring .cid{margin-top:calc(var(--top) + 52px)}
.ring-foot{margin-top:auto;padding:0 44px calc(var(--bottom) + 46px)}
.ring-minor{display:flex;justify-content:space-between;padding:0 10px;margin-bottom:46px}
.minor{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;color:#fff}
.minor .ico{width:28px;height:28px;display:grid;place-items:center}
.ring-main{display:flex;justify-content:space-between}
.big{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px}
.circle{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;transition:filter .12s,transform .12s}
.circle:active{filter:brightness(.82);transform:scale(.96)}
.red{background:#eb4e3d}.green{background:#65c466}

/* ---------- in call ---------- */
#v-call .cid{margin-top:calc(var(--top) + 46px)}
#v-call .name{font-size:32px}
.grid{margin-top:auto;padding:0 36px calc(var(--bottom) + 60px);display:grid;grid-template-columns:repeat(3,1fr);row-gap:26px;justify-items:center}
.key{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:#fff}
.key .circle{width:78px;height:78px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:#fff}
.key.on .circle{background:#fff;color:#1c1c1e}
.key.end .circle{background:#eb4e3d}
.key[disabled]{opacity:1}
.key.dim .circle{opacity:.5}
</style>
</head>
<body class="__BODY_CLASS__" data-initial-call="__INITIAL_CALL__">
<div class="device" id="device">
 <div class="screen">
  <div class="statusbar" id="statusbar">
   <span class="clock-slot" id="sb-time">9:41</span>
   <span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.4c2.3 0 4.4.9 6 2.4l1.2-1.2C13.3 1.7 10.8.7 8 .7S2.7 1.7.8 3.6L2 4.8c1.6-1.5 3.7-2.4 6-2.4z"/><path d="M8 5.8c1.4 0 2.6.5 3.6 1.4l1.2-1.2C11.5 4.8 9.8 4.1 8 4.1S4.5 4.8 3.2 6l1.2 1.2c1-.9 2.2-1.4 3.6-1.4z"/><path d="M8 9.1c.5 0 1 .2 1.3.5L8 11.3 6.7 9.6c.3-.3.8-.5 1.3-.5z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2.4" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="#fff" fill-opacity=".45"/></svg>
   </span>
  </div>
  <div class="island"></div>

  <!-- Lock screen -->
  <section class="view" id="v-lock">
   <div class="ls-head">
    <div class="ls-date" id="ls-date">Sunday 22 November</div>
    <div class="ls-time" id="ls-time">9:41</div>
   </div>
   <div class="ls-foot">
    <button class="ls-btn" aria-label="Flashlight"><svg width="16" height="24" viewBox="0 0 16 24" fill="#fff"><path d="M1 1.5C1 .7 1.7 0 2.5 0h11c.8 0 1.5.7 1.5 1.5V4H1V1.5z"/><path d="M1 5.5h14l-3 5V22c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V10.5l-3-5z"/><circle cx="8" cy="14" r="1.6" fill="#555"/></svg></button>
    <button class="ls-btn" aria-label="Camera"><svg width="24" height="19" viewBox="0 0 24 19" fill="#fff"><path d="M8.3 0h7.4c.8 0 1.4.4 1.8 1l1.1 1.8h2.4c1.7 0 3 1.3 3 3V16c0 1.7-1.3 3-3 3H3c-1.7 0-3-1.3-3-3V5.8c0-1.7 1.3-3 3-3h2.4L6.5 1c.4-.6 1-1 1.8-1z"/><circle cx="12" cy="10.6" r="4.6" fill="#3a3a44"/><circle cx="12" cy="10.6" r="3.3" fill="#fff"/></svg></button>
   </div>
  </section>

  <!-- Incoming call -->
  <section class="view callbg" id="v-ring" hidden>
   <div class="cid">
    <div class="sub" id="r-sub">mobile</div>
    <div class="name" id="r-name">PIXEL Air Freight</div>
   </div>
   <div class="ring-foot">
    <div class="ring-minor">
     <div class="minor"><span class="ico"><svg width="26" height="26" viewBox="0 0 26 26" fill="#fff"><path d="M13 4.5a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 3a1 1 0 0 0-1 1v6c0 .3.1.5.3.7l3.5 3.5a1 1 0 0 0 1.4-1.4L14 14.1V8.5a1 1 0 0 0-1-1z"/><path d="M2.3 6.6a1 1 0 0 1-.6-1.8l3.6-2.9a1 1 0 0 1 1.3 1.6L3 6.4a1 1 0 0 1-.7.2zm21.4 0a1 1 0 0 1-.7-.2l-3.6-2.9a1 1 0 1 1 1.3-1.6l3.6 2.9a1 1 0 0 1-.6 1.8z"/></svg></span>Remind Me</div>
     <div class="minor"><span class="ico"><svg width="26" height="24" viewBox="0 0 26 24" fill="#fff"><path d="M13 1C6.4 1 1 5.4 1 10.8c0 3.1 1.7 5.8 4.4 7.6-.2 1.6-1 3.2-2.3 4.3 2.6.1 5-.8 6.6-2.4 1 .3 2.2.4 3.3.4 6.6 0 12-4.4 12-9.9S19.6 1 13 1z"/></svg></span>Message</div>
    </div>
    <div class="ring-main">
     <div class="big"><button class="circle red" id="btn-decline" aria-label="Decline">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="#fff"><path d="M17 12.5c-4.6 0-8.9 1.2-12 3.6-1.1.9-1.6 2.3-1.3 3.7l.4 1.8c.3 1.2 1.5 2 2.7 1.8l4.2-.7c1.1-.2 1.9-1.1 2-2.2l.2-2.2c1.2-.4 2.5-.6 3.8-.6s2.6.2 3.8.6l.2 2.2c.1 1.1.9 2 2 2.2l4.2.7c1.2.2 2.4-.6 2.7-1.8l.4-1.8c.3-1.4-.2-2.8-1.3-3.7-3.1-2.4-7.4-3.6-12-3.6z"/></svg>
     </button>Decline</div>
     <div class="big"><button class="circle green" id="btn-accept" aria-label="Accept">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="#fff"><path d="M10.5 4.2c-.7-1.1-2-1.6-3.2-1.2l-1.8.6C3.8 4.2 2.7 5.9 3 7.7c1.3 9.8 9.5 18 19.3 19.3 1.8.3 3.5-.8 4.1-2.5l.6-1.8c.4-1.2-.1-2.5-1.2-3.2l-3.7-2.3c-1-.6-2.2-.5-3.1.2l-1.6 1.4c-2.9-1.5-5.2-3.8-6.7-6.7L12 10.5c.7-.9.8-2.1.2-3.1z"/></svg>
     </button>Accept</div>
    </div>
   </div>
  </section>

  <!-- In call -->
  <section class="view callbg" id="v-call" hidden>
   <div class="cid">
    <div class="name" id="c-name">PIXEL Air Freight</div>
    <div class="sub" id="c-timer" style="margin-top:6px">calling…</div>
   </div>
   <div class="grid">
    <div class="key" data-toggle><button class="circle" aria-label="Audio"><svg width="30" height="26" viewBox="0 0 30 26" fill="currentColor"><path d="M3 8.5h4l6.2-5.6c.9-.8 2.3-.2 2.3 1v18.2c0 1.2-1.4 1.8-2.3 1L7 17.5H3c-1.1 0-2-.9-2-2v-5c0-1.1.9-2 2-2z"/><path d="M19.6 8.3a1.2 1.2 0 0 1 1.7.2 7.4 7.4 0 0 1 0 9 1.2 1.2 0 1 1-1.9-1.5 5 5 0 0 0 0-6 1.2 1.2 0 0 1 .2-1.7z"/><path d="M23.4 4.6a1.2 1.2 0 0 1 1.7.1 12.7 12.7 0 0 1 0 16.6 1.2 1.2 0 1 1-1.8-1.6 10.3 10.3 0 0 0 0-13.4 1.2 1.2 0 0 1 .1-1.7z"/></svg></button>audio</div>
    <div class="key dim"><button class="circle" aria-label="FaceTime"><svg width="32" height="22" viewBox="0 0 32 22" fill="currentColor"><rect x="1" y="2" width="21" height="18" rx="4.5"/><path d="M24 8.6l5.4-3.7c.7-.5 1.6 0 1.6.8v10.6c0 .8-.9 1.3-1.6.8L24 13.4z"/></svg></button>FaceTime</div>
    <div class="key" id="k-mute" data-toggle><button class="circle" aria-label="Mute"><svg width="26" height="30" viewBox="0 0 26 30" fill="currentColor"><path d="M13 1.5a5 5 0 0 1 5 5v7.8L8.2 4.5A5 5 0 0 1 13 1.5zM8 10.2l9.4 9.4A5 5 0 0 1 8 16.5z"/><path d="M5 14.5a1.2 1.2 0 0 1 1.2 1.2v.8a6.8 6.8 0 0 0 10.6 5.6l1.7 1.7a9.1 9.1 0 0 1-4.3 1.7v2.2h3.3a1.2 1.2 0 1 1 0 2.4H8.5a1.2 1.2 0 1 1 0-2.4h3.3v-2.2a9.2 9.2 0 0 1-8-9v-.8A1.2 1.2 0 0 1 5 14.5zm16 0a1.2 1.2 0 0 1 1.2 1.2v.8c0 1.2-.2 2.3-.6 3.3l-1.9-1.9c.1-.5.1-.9.1-1.4v-.8A1.2 1.2 0 0 1 21 14.5z"/><path d="M2.3 2.3a1.1 1.1 0 0 1 1.6 0l20 20a1.1 1.1 0 0 1-1.6 1.6l-20-20a1.1 1.1 0 0 1 0-1.6z"/></svg></button>mute</div>
    <div class="key dim"><button class="circle" aria-label="Add call"><svg width="30" height="28" viewBox="0 0 30 28" fill="currentColor"><circle cx="11" cy="7.5" r="6"/><path d="M11 15.5c-5.8 0-10 3.2-10 7.4 0 1.2 1 2.1 2.2 2.1h12.3a8 8 0 0 1 1.4-9 15 15 0 0 0-5.9-.5z"/><path d="M23 14.5a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0 2.3c-.5 0-.9.4-.9.9v2h-2c-.5 0-.9.4-.9.9s.4.9.9.9h2v2c0 .5.4.9.9.9s.9-.4.9-.9v-2h2c.5 0 .9-.4.9-.9s-.4-.9-.9-.9h-2v-2c0-.5-.4-.9-.9-.9z"/></svg></button>add</div>
    <div class="key end"><button class="circle" id="btn-end" aria-label="End call"><svg width="34" height="34" viewBox="0 0 34 34" fill="#fff"><path d="M17 12.5c-4.6 0-8.9 1.2-12 3.6-1.1.9-1.6 2.3-1.3 3.7l.4 1.8c.3 1.2 1.5 2 2.7 1.8l4.2-.7c1.1-.2 1.9-1.1 2-2.2l.2-2.2c1.2-.4 2.5-.6 3.8-.6s2.6.2 3.8.6l.2 2.2c.1 1.1.9 2 2 2.2l4.2.7c1.2.2 2.4-.6 2.7-1.8l.4-1.8c.3-1.4-.2-2.8-1.3-3.7-3.1-2.4-7.4-3.6-12-3.6z"/></svg></button>end</div>
    <div class="key" data-toggle><button class="circle" aria-label="Keypad"><svg width="26" height="30" viewBox="0 0 26 30" fill="currentColor"><circle cx="4.5" cy="4" r="3.2"/><circle cx="13" cy="4" r="3.2"/><circle cx="21.5" cy="4" r="3.2"/><circle cx="4.5" cy="11.7" r="3.2"/><circle cx="13" cy="11.7" r="3.2"/><circle cx="21.5" cy="11.7" r="3.2"/><circle cx="4.5" cy="19.4" r="3.2"/><circle cx="13" cy="19.4" r="3.2"/><circle cx="21.5" cy="19.4" r="3.2"/><circle cx="13" cy="27" r="3.2"/></svg></button>keypad</div>
   </div>
  </section>

  <div class="homebar"></div>
 </div>
</div>
<script type="module" src="/voice/phone.js"></script>
</body>
</html>
