name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  kpi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The base runs its own code on this branch's fixtures. Without its result the comment shows this branch alone.
      - run: (cd base && uv run --locked python -m tools.kpi ../tests/fixtures/mails > ../base.json) || rm -f base.json
      - run: uv run --locked python -m tools.kpi --base base.json > kpi.md
      - run: gh pr comment ${{ github.event.pull_request.number }} --body-file kpi.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
